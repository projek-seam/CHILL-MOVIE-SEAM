<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register — Chill</title>


    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>


<body>


<main class="auth-page">


    <section class="auth-box">


        <!-- LOGO -->

        <div class="auth-logo">

        <a
        class="brand"
        href="#"
        >
        <i class="fa-solid fa-clapperboard"></i>
        CHILL
        </a>
        </div>


        <!-- TITLE -->

        <h1 class="auth-title">
            Daftar
        </h1>


        <p class="auth-subtitle">
            Selamat datang
        </p>


        <!-- REGISTER FORM -->

        <form id="registerForm">


            <!-- USERNAME -->

            <div class="field">

                <label for="username">
                    USERNAME
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    KATA SANDI
                </label>

                <div class="password-wrapper">

                    <input
                        id="password"
                        type="password"
                        placeholder="Masukkan kata sandi"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="field">

                <label for="confirm">
                    KONFIRMASI KATA SANDI
                </label>

                <div class="password-wrapper">

                    <input
                        id="confirm"
                        type="password"
                        placeholder="Masukkan kata sandi"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="confirmToggle"
                    >
                        👁
                    </button>

                </div>


                <div
                    class="error"
                    id="passwordError"
                >
                    Kata sandi tidak sama.
                </div>

            </div>


            <!-- REGISTER -->

            <button
                class="auth-button"
                type="submit"
            >
                Daftar
            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
            atau
        </div>


        <!-- GOOGLE -->

        <button
            class="google-button"
            id="googleRegister"
            type="button"
        >

            <span>G</span>

            &nbsp;

            Daftar dengan Google

        </button>


        <!-- LOGIN -->

        <p class="auth-footer">

            Sudah punya akun?

            <a href="login.html">
                Masuk
            </a>

        </p>


    </section>


</main>


<script src="register.js"></script>

</body>

</html>
