<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — Chill</title>

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


<main class="auth-page">


    <section class="auth-box">


        <!-- LOGO -->

        <div class="auth-logo">

            <a
                class="brand"
                href="#"
            >
            <i class="fa-solid fa-clapperboard"></i>
                CHILL
            </a>

        </div>


        <!-- TITLE -->

        <h1 class="auth-title">
            Selamat datang kembali
        </h1>


        <p class="auth-subtitle">
            Masuk untuk melanjutkan menonton
            film favoritmu.
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="field">

                <label for="username">
                    USERNAME
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <div class="password-wrapper">

                    <input
                        id="password"
                        type="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- REMEMBER + FORGOT -->

            <div class="auth-row">

                <label>

                    <input
                        type="checkbox"
                    >

                    Ingat saya

                </label>


                <a
                    href="#"
                    id="forgot"
                >
                    Lupa password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                class="auth-button"
                href="index.html"
            >
                Masuk
            </button>


        </form>


        <!-- DIVIDER -->

        <div class="divider">
            atau
        </div>


        <!-- GOOGLE -->

        <button
            class="google-button"
            id="googleLogin"
            type="button">

        <svg
        class="google-icon"
        viewBox="0 0 24 24"
        width="18"
        height="18"
    >
        <path
            fill="#4285F4"
            d="M21.35 12.23c0-.79-.07-1.55-.22-2.28H12v4.32h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.43z"
        />
        <path
            fill="#34A853"
            d="M12 21.75c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.7-1.72-5.47-4.03H3.28v2.53A9.75 9.75 0 0 0 12 21.75z"
        />
        <path
            fill="#FBBC05"
            d="M6.53 13.85A5.86 5.86 0 0 1 6.22 12c0-.64.11-1.26.31-1.85V7.62H3.28A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.03 4.38l3.25-2.53z"
        />
        <path
            fill="#EA4335"
            d="M12 6.12c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.22 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.72 5.37l3.25 2.53C7.3 7.84 9.46 6.12 12 6.12z"
        />
        </svg>

            Masuk dengan Google

        </button>


        <!-- REGISTER -->

        <p class="auth-footer">

            Belum punya akun?

            <a href="register.html">
                Daftar sekarang
            </a>

        </p>


    </section>


</main>


<script src="login.js"></script>

</body>

</html>
